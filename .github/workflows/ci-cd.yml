name: CI/CD do site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Validar o site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verificar as páginas e montar o site
        run: |
          python - <<'PY'
          import re
          import shutil
          from pathlib import Path

          pages = {page.name: page for page in Path.cwd().glob("*.html")}
          if "index.html" not in pages:
              raise SystemExit("index.html ausente")

          home = pages["index.html"].read_text(encoding="utf-8")
          targets = set(re.findall(r"""window\.location\s*=\s*['"]([^'"]+\.html)['"]""", home))
          if not targets:
              raise SystemExit("Nenhum link para música encontrado na página inicial")

          missing = targets - pages.keys()
          if missing:
              raise SystemExit("Páginas ausentes: " + ", ".join(sorted(missing)))

          output = Path("_site")
          output.mkdir()
          for page in pages.values():
              if not page.read_text(encoding="utf-8").strip():
                  raise SystemExit(f"Página vazia: {page.name}")
              shutil.copyfile(page, output / page.name)

          print(f"{len(pages)} páginas e {len(targets)} destinos de navegação verificados.")
          PY
      - name: Enviar artefato do Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publicar no GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
